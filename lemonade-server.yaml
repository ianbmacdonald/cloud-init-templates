#cloud-config
# Install Lemonade Server from its Launchpad PPA and bring up an OpenAI-compatible
# endpoint on first boot.
#
# vllm-docker.yaml stands the serving stack UP on the box. This one INSTALLS it: the
# server, model manager and web UI arrive as a signed Debian package, so there is no
# container to pull and no ROCm/PyTorch reconciliation to get right.
#
#   Project: https://lemonade-server.ai
#   PPA:     https://launchpad.net/~lemonade-team/+archive/ubuntu/stable
#
# The package creates a `lemonade` system user, adds it to `render` for GPU access, and
# enables lemond.service. The server listens on 127.0.0.1:13305. ufw permits port 22
# only, so reach it over an SSH tunnel — see the README.

apt:
  sources:
    lemonade-stable:
      source: "ppa:lemonade-team/stable"

package_update: true

packages:
  - lemonade-server

runcmd:
  - |
    # The `lemonade` CLI is an HTTP client for the daemon, not a local tool — so wait
    # for lemond to answer before asking it to do anything. Everything below is a
    # request TO the server, and the server does the work in its own cache.
    echo "Waiting for lemond..."
    for _ in $(seq 1 60); do
      curl -sf http://localhost:13305/api/v1/health >/dev/null 2>&1 && break
      sleep 2
    done
  - |
    # Install the ROCm llama.cpp backend for this GPU. The server downloads a prebuilt
    # backend — nothing is compiled on the box.
    #
    # Install rocm EXPLICITLY and do not install the vulkan backend. On a virtualised
    # GPU (SR-IOV) Mesa often cannot bind the passed-through render node, so the only
    # Vulkan device that enumerates is `llvmpipe` — a CPU software rasteriser. llama.cpp
    # then initialises against it *successfully* and runs the model on the CPU at
    # roughly 1/50th the speed, with no error and no warning anywhere. Installing only
    # rocm means there is no software device for auto-select to pick.
    echo "Installing the ROCm llama.cpp backend..."
    lemonade backends install llamacpp:rocm
  - |
    # Large models: force --no-mmap. llama.cpp memory-maps the GGUF by default, so a
    # model FILE larger than host RAM can never be cached — every pass over it evicts
    # the last and the load thrashes the page cache indefinitely. It does not fail; it
    # simply never finishes, and the server is restarted on a loop. Measured on a
    # 340 GiB model against 220 GiB of RAM: page cache pinned at 213 GiB, ~2 GiB/s of
    # sustained disk read, no progress. With --no-mmap the same load reaches 171 GiB
    # resident in 39 seconds.
    #
    # Harmless when the model does fit in RAM (slower initial read, no other effect),
    # so it is safe to set unconditionally here.
    echo "Disabling mmap for large-model loads..."
    lemonade config set llamacpp.args="--no-mmap"
  - |
    # Optional: pre-pull a model so the first request is warm. Skip it and the server
    # will pull on demand instead. Any model in the registry works; `lemonade list`
    # shows them.
    echo "Pulling a model..."
    lemonade pull Qwen3-8B-GGUF
  - |
    echo "Lemonade Server is ready on 127.0.0.1:13305"
    lemonade backends
    lemonade status
